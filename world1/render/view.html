<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>1세계 렌더</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const Q = new URLSearchParams(location.search);
const NAME = Q.get('view') || 'test';
const W = +(Q.get('w') || 2560), H = +(Q.get('h') || 1440), PR = +(Q.get('pr') || 1.5);
const log = s => console.log('[view] ' + s);

try {
  const meta = await (await fetch(`cache/${NAME}.json`)).json();
  const bin = await (await fetch(`cache/${NAME}.bin`)).arrayBuffer();
  const v = meta.view;

  const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(PR); renderer.setSize(W, H);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = v.exposure ?? 0.6;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();

  // 태양: 지정이 없으면 카메라 뒤쪽 비스듬히 (정면광, 눈부심 없음)
  let sunDir;
  if (v.sunDir) sunDir = new THREE.Vector3(...v.sunDir).normalize();
  else {
    const f = new THREE.Vector3(v.tgt[0] - v.pos[0], 0, v.tgt[2] - v.pos[2]).normalize().negate();
    const a = (v.sunAz ?? 50) * Math.PI / 180, el = (v.sunEl ?? 32) * Math.PI / 180;
    const h = new THREE.Vector3(f.x * Math.cos(a) - f.z * Math.sin(a), 0, f.x * Math.sin(a) + f.z * Math.cos(a));
    sunDir = new THREE.Vector3(h.x * Math.cos(el), Math.sin(el), h.z * Math.cos(el)).normalize();
  }
  const sky = new Sky(); sky.scale.setScalar(50000);
  const su = sky.material.uniforms;
  su.turbidity.value = v.turbidity ?? 2.6; su.rayleigh.value = v.rayleigh ?? 1.35; su.mieCoefficient.value = 0.0032; su.mieDirectionalG.value = 0.76;
  su.sunPosition.value.copy(sunDir);
  scene.add(sky);
  const pm = new THREE.PMREMGenerator(renderer);
  const es = new THREE.Scene(); const sky2 = new Sky(); sky2.scale.setScalar(50000);
  Object.keys(su).forEach(k => sky2.material.uniforms[k].value = su[k].value); es.add(sky2);
  scene.environment = pm.fromScene(es, 0.02).texture;
  const fogC = new THREE.Color(v.fog || 0xaec6e4);
  scene.fog = new THREE.Fog(fogC, v.fogNear ?? 700, v.fogFar ?? 3400);

  const tgt = new THREE.Vector3(...v.tgt);
  const sun = new THREE.DirectionalLight(v.sun === 'noon' ? 0xfff4e0 : 0xffdcb0, v.sunI ?? 4.6);
  const sr = v.shadowR ?? Math.min(260, v.detail);
  sun.position.copy(sunDir).multiplyScalar(600).add(tgt); sun.target.position.copy(tgt);
  sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
  Object.assign(sun.shadow.camera, { left: -sr, right: sr, top: sr, bottom: -sr, near: 10, far: 1400 });
  sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.06;
  scene.add(sun, sun.target);
  scene.add(new THREE.HemisphereLight(0xaac4ea, 0x5e4c3a, 0.4));

  const atlas = await new THREE.TextureLoader().loadAsync('cache/atlas.png');
  atlas.magFilter = THREE.NearestFilter; atlas.minFilter = THREE.NearestFilter; atlas.generateMipmaps = false; atlas.colorSpace = THREE.SRGBColorSpace;

  const M = {
    opaque: new THREE.MeshStandardMaterial({ map: atlas, vertexColors: true, roughness: 0.9, metalness: 0, envMapIntensity: 0.45 }),
    cutout: new THREE.MeshStandardMaterial({ map: atlas, vertexColors: true, roughness: 0.85, alphaTest: 0.5, side: THREE.DoubleSide, envMapIntensity: 0.45 }),
    trans: new THREE.MeshStandardMaterial({ map: atlas, vertexColors: true, transparent: true, roughness: 0.1, envMapIntensity: 1.0, depthWrite: false, side: THREE.DoubleSide }),
    water: new THREE.MeshStandardMaterial({ map: atlas, vertexColors: true, transparent: true, opacity: 0.92, roughness: 0.06, metalness: 0.1, envMapIntensity: 1.3, depthWrite: false }),
    emit: new THREE.MeshStandardMaterial({ map: atlas, emissiveMap: atlas, emissive: 0xffffff, emissiveIntensity: 2.2, vertexColors: true, roughness: 0.6, alphaTest: 0.5, side: THREE.DoubleSide }),
    lod: new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, envMapIntensity: 0.4, side: THREE.DoubleSide }),
    lodwater: new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.08, metalness: 0.15, envMapIntensity: 1.2 }),
  };
  let faces = 0;
  for (const [name, g] of Object.entries(meta.groups)) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Int16Array(bin, g.p, g.count * 3), 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(new Int8Array(bin, g.n, g.count * 3), 3, true));
    geo.setAttribute('uv', new THREE.BufferAttribute(new Uint16Array(bin, g.uv, g.count * 2), 2, true));
    geo.setAttribute('color', new THREE.BufferAttribute(new Uint8Array(bin, g.c, g.count * 3), 3, true));
    geo.setIndex(new THREE.BufferAttribute(new Uint32Array(bin, g.i, g.icount), 1));
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 1e7);
    const m = new THREE.Mesh(geo, M[name]);
    m.scale.setScalar(1 / 16);
    m.castShadow = name !== 'trans' && name !== 'water' && name !== 'lodwater';
    m.receiveShadow = true;
    if (name === 'trans' || name === 'water') m.renderOrder = 2;
    m.frustumCulled = false;
    scene.add(m);
    faces += g.icount / 6;
  }
  log('faces ' + faces);

  // 굴뚝 연기
  const pc = document.createElement('canvas'); pc.width = pc.height = 16;
  const pg = pc.getContext('2d');
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const d = Math.hypot(x - 7.5, y - 7.5) / 7.5 + (Math.sin(x * 12.9 + y * 78.2) * 0.12); if (d < 1) { const c = 200 + ((x * 37 + y * 17) % 55); pg.fillStyle = `rgba(${c},${c},${c},${Math.min(1, (1 - d) * 1.5)})`; pg.fillRect(x, y, 1, 1); } }
  const puff = new THREE.CanvasTexture(pc); puff.magFilter = THREE.NearestFilter; puff.minFilter = THREE.NearestFilter; puff.colorSpace = THREE.SRGBColorSpace;
  let sd = 1;
  const rr = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  for (const [x, y, z] of meta.chimneys) for (let i = 0; i < 7; i++) {
    const t = i / 7;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puff, color: 0xcfcac4, transparent: true, depthWrite: false, opacity: 0.45 * (1 - t) + 0.06 }));
    const sz = 0.9 + t * 3.2; s.scale.set(sz, sz, 1);
    s.position.set(x + 0.5 + t * t * 7 + (rr() - 0.5) * t, y + 0.5 + t * 9, z + 0.5 - t * t * 3 + (rr() - 0.5) * t);
    scene.add(s);
  }

  const cam = new THREE.PerspectiveCamera(v.fov, W / H, 0.1, 60000);
  cam.position.set(...v.pos); cam.lookAt(tgt); cam.updateProjectionMatrix();

  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(PR); composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, cam));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), v.bloom ?? 0.45, 0.4, 1.3));
  composer.addPass(new OutputPass());
  composer.addPass(new ShaderPass({
    uniforms: { tDiffuse: { value: null } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
      void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 d=vUv-0.5; float vg=smoothstep(0.9,0.3,length(d*vec2(1.2,1.0)));
      c.rgb*=mix(0.74,1.0,vg); gl_FragColor=c; }`,
  }));
  const t0 = performance.now();
  composer.render();
  log('render ' + Math.round(performance.now() - t0) + 'ms');
  window.__done = true;
} catch (e) { console.error(e); window.__err = String(e && e.stack || e); window.__done = true; }
</script>
</body>
</html>
