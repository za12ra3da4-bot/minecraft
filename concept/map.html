<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>새벽의 변경 컨셉 맵</title>
<style>
  html, body { margin: 0; background: #2a2118; }
  svg { display: block; font-family: "WenQuanYi Zen Hei", sans-serif; }
  .rname { font-size: 30px; font-weight: bold; fill: #2b1d0e; paint-order: stroke; stroke: #f3e6c4; stroke-width: 6px; stroke-linejoin: round; }
  .rsub  { font-size: 17px; fill: #4a3620; paint-order: stroke; stroke: #f3e6c4; stroke-width: 5px; stroke-linejoin: round; }
  .poi   { font-size: 16px; fill: #3b2a14; paint-order: stroke; stroke: #f6ecd2; stroke-width: 4px; stroke-linejoin: round; }
  .step  { font-size: 18px; font-weight: bold; fill: #fff; }
  .ptitle{ font-size: 30px; font-weight: bold; fill: #f3e6c4; }
  .ph    { font-size: 21px; font-weight: bold; fill: #f3c969; }
  .pt    { font-size: 16px; fill: #e8dcc0; }
  .pm    { font-size: 14px; fill: #b5a684; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1120" viewBox="0 0 1860 1120">
  <defs>
    <radialGradient id="parch" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#f4e7c5"/>
      <stop offset="70%" stop-color="#e6d3a3"/>
      <stop offset="100%" stop-color="#c9ad74"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fb9c4"/>
      <stop offset="100%" stop-color="#5e8fa0"/>
    </linearGradient>
    <pattern id="waves" width="60" height="30" patternUnits="userSpaceOnUse">
      <path d="M5 18 q10 -8 20 0 t20 0" fill="none" stroke="#e8f2f2" stroke-width="1.6" opacity=".55"/>
    </pattern>
    <pattern id="ash" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="1.4" fill="#5b4c46" opacity=".5"/>
      <circle cx="16" cy="15" r="1.1" fill="#7a3a2a" opacity=".5"/>
    </pattern>
    <g id="tree">
      <path d="M0 -22 L11 0 L-11 0 Z" fill="#3f6b3a" stroke="#223f20" stroke-width="1.5"/>
      <path d="M0 -32 L8 -14 L-8 -14 Z" fill="#4c7d45" stroke="#223f20" stroke-width="1.5"/>
      <rect x="-2" y="0" width="4" height="6" fill="#5a3b1c"/>
    </g>
    <g id="mtn">
      <path d="M-40 0 L0 -62 L40 0 Z" fill="#9aa3ad" stroke="#4d5560" stroke-width="2"/>
      <path d="M0 -62 L-14 -40 L-4 -44 L4 -36 L14 -40 Z" fill="#fbfdff" stroke="#4d5560" stroke-width="1.5"/>
      <path d="M0 -62 L12 0" stroke="#6d7580" stroke-width="2" fill="none"/>
    </g>
    <g id="hill">
      <path d="M-34 0 Q-18 -34 0 -36 Q18 -34 34 0 Z" fill="#a98b62" stroke="#5e4629" stroke-width="2"/>
      <path d="M-6 -30 Q4 -18 2 0" stroke="#7a5d3a" stroke-width="1.5" fill="none"/>
    </g>
    <g id="house">
      <rect x="-12" y="-12" width="24" height="16" fill="#d9b98a" stroke="#4a3620" stroke-width="1.5"/>
      <path d="M-16 -12 L0 -26 L16 -12 Z" fill="#a0462f" stroke="#4a3620" stroke-width="1.5"/>
      <rect x="-3" y="-6" width="6" height="10" fill="#5a3b1c"/>
    </g>
    <g id="ruin">
      <rect x="-14" y="-30" width="7" height="30" fill="#b7b0a0" stroke="#4d4a42" stroke-width="1.5"/>
      <rect x="6" y="-20" width="7" height="20" fill="#b7b0a0" stroke="#4d4a42" stroke-width="1.5"/>
      <rect x="-18" y="-34" width="15" height="5" fill="#cfc8b6" stroke="#4d4a42" stroke-width="1.2"/>
    </g>
    <!-- 범례 기호 -->
    <g id="wp"><path d="M0 -18 L0 4" stroke="#3b2a14" stroke-width="2.5"/><path d="M0 -18 L14 -13 L0 -8 Z" fill="#2f7fbf" stroke="#1d4e76" stroke-width="1.2"/><circle r="4" cy="4" fill="#3b2a14"/></g>
    <g id="star"><path d="M0 -12 L3.5 -4 L12 -4 L5 1.5 L7.5 10 L0 5 L-7.5 10 L-5 1.5 L-12 -4 L-3.5 -4 Z" fill="#f3c02c" stroke="#7a5500" stroke-width="1.5"/></g>
    <g id="chest"><rect x="-10" y="-8" width="20" height="14" rx="2" fill="#a86a2a" stroke="#4a2c0c" stroke-width="1.6"/><rect x="-10" y="-8" width="20" height="5" fill="#c98a3e" stroke="#4a2c0c" stroke-width="1.2"/><rect x="-2" y="-4" width="4" height="5" fill="#f3c02c" stroke="#4a2c0c" stroke-width=".8"/></g>
    <g id="npc"><circle r="12" fill="#fff4c9" stroke="#8a5a00" stroke-width="2"/><text y="6" text-anchor="middle" font-size="18" font-weight="bold" fill="#c47a00">!</text></g>
  </defs>

  <!-- ===== 지도 바탕 ===== -->
  <rect x="0" y="0" width="1420" height="1120" fill="#3a2c1c"/>
  <rect x="18" y="18" width="1384" height="1084" rx="6" fill="url(#parch)" stroke="#6b4f2a" stroke-width="4"/>

  <!-- 남쪽 바다 -->
  <path d="M760 1102 C820 1010 900 990 980 1010 C1060 1030 1120 960 1200 950 C1280 940 1340 900 1402 880 L1402 1102 Z" fill="url(#sea)"/>
  <path d="M760 1102 C820 1010 900 990 980 1010 C1060 1030 1120 960 1200 950 C1280 940 1340 900 1402 880 L1402 1102 Z" fill="url(#waves)"/>
  <text x="1230" y="1060" class="rsub" font-style="italic" font-size="22">잔잔한 남해</text>

  <!-- 강: 서리 봉우리 → 숲 옆 → 마을 → 바다 -->
  <path d="M760 250 C730 330 690 380 700 450 C710 520 650 560 640 640 C630 720 700 790 760 850 C820 910 860 960 880 1000"
        fill="none" stroke="#6ea3b5" stroke-width="12" stroke-linecap="round"/>
  <path d="M760 250 C730 330 690 380 700 450 C710 520 650 560 640 640 C630 720 700 790 760 850 C820 910 860 960 880 1000"
        fill="none" stroke="#a9d0da" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== 지역 영역 ===== -->
  <!-- 서리 봉우리 (북) -->
  <path d="M470 60 C600 40 760 50 900 70 C1000 90 1010 170 960 240 C900 320 760 330 640 310 C540 295 460 250 440 180 C425 120 430 70 470 60 Z"
        fill="#e7eef3" fill-opacity=".85" stroke="#6d86a0" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- 버려진 광산 (북동) -->
  <path d="M1000 250 C1100 220 1250 230 1330 290 C1380 340 1370 450 1300 510 C1230 560 1110 560 1040 520 C980 480 950 400 960 330 C965 290 975 262 1000 250 Z"
        fill="#cdb48c" fill-opacity=".8" stroke="#7a5d3a" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- 속삭이는 숲 (서) -->
  <path d="M70 280 C160 240 330 250 450 300 C560 350 600 450 580 560 C560 660 450 720 330 720 C210 720 110 670 70 580 C40 500 40 330 70 280 Z"
        fill="#9dbd84" fill-opacity=".85" stroke="#3f6b3a" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- 새벽골 마을 (중앙, 시작) -->
  <path d="M600 520 C680 480 820 480 890 530 C950 580 950 680 890 740 C820 800 690 800 620 750 C560 705 545 570 600 520 Z"
        fill="#e9d98f" fill-opacity=".9" stroke="#8a6a1a" stroke-width="3.5"/>
  <!-- 가라앉은 유적 (남동, 해안) -->
  <path d="M960 640 C1060 610 1220 620 1310 680 C1380 730 1370 830 1300 880 C1240 925 1140 960 1060 950 C980 940 920 880 910 800 C900 730 910 660 960 640 Z"
        fill="#a6c7c2" fill-opacity=".8" stroke="#3f7a7a" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- 잿빛 황무지 (남서, 봉인) -->
  <path d="M60 790 C160 760 330 770 450 800 C560 830 600 900 570 980 C540 1060 400 1090 260 1085 C140 1080 60 1040 45 960 C35 890 30 810 60 790 Z"
        fill="#9a8f8a" fill-opacity=".85" stroke="#5b2a20" stroke-width="3" stroke-dasharray="4 5"/>
  <path d="M60 790 C160 760 330 770 450 800 C560 830 600 900 570 980 C540 1060 400 1090 260 1085 C140 1080 60 1040 45 960 C35 890 30 810 60 790 Z"
        fill="url(#ash)"/>

  <!-- ===== 지형 장식 ===== -->
  <!-- 산 -->
  <use href="#mtn" x="560" y="200"/><use href="#mtn" x="640" y="170" transform="translate(640 170) scale(1.35) translate(-640 -170)"/>
  <use href="#mtn" x="740" y="160"/><use href="#mtn" x="830" y="215"/><use href="#mtn" x="900" y="160" transform="translate(900 160) scale(.8) translate(-900 -160)"/>
  <use href="#mtn" x="505" y="265" transform="translate(505 265) scale(.7) translate(-505 -265)"/>
  <!-- 언덕/광산 -->
  <use href="#hill" x="1060" y="330"/><use href="#hill" x="1150" y="300"/><use href="#hill" x="1250" y="350"/>
  <use href="#hill" x="1100" y="450"/><use href="#hill" x="1300" y="450"/>
  <path d="M1188 420 q14 -22 28 0 z" fill="#2b1d0e"/>
  <!-- 숲 -->
  <g>
    <use href="#tree" x="130" y="340"/><use href="#tree" x="170" y="330"/><use href="#tree" x="220" y="340"/><use href="#tree" x="270" y="325"/>
    <use href="#tree" x="330" y="345"/><use href="#tree" x="390" y="350"/><use href="#tree" x="440" y="375"/>
    <use href="#tree" x="110" y="420"/><use href="#tree" x="160" y="440"/><use href="#tree" x="420" y="440"/><use href="#tree" x="480" y="460"/>
    <use href="#tree" x="120" y="520"/><use href="#tree" x="175" y="560"/><use href="#tree" x="460" y="540"/><use href="#tree" x="520" y="520"/>
    <use href="#tree" x="140" y="620"/><use href="#tree" x="200" y="650"/><use href="#tree" x="260" y="670"/><use href="#tree" x="330" y="680"/>
    <use href="#tree" x="400" y="650"/><use href="#tree" x="470" y="620"/><use href="#tree" x="530" y="600"/>
  </g>
  <!-- 마을 -->
  <use href="#house" x="700" y="600"/><use href="#house" x="745" y="580"/><use href="#house" x="790" y="610"/>
  <use href="#house" x="720" y="660"/><use href="#house" x="820" y="665"/><use href="#house" x="770" y="700"/>
  <circle cx="760" cy="640" r="7" fill="#8a6a1a"/>
  <!-- 유적 -->
  <use href="#ruin" x="1030" y="760"/><use href="#ruin" x="1120" y="720"/><use href="#ruin" x="1210" y="780"/><use href="#ruin" x="1150" y="860"/>
  <ellipse cx="1150" cy="800" rx="55" ry="26" fill="#6ea3b5" opacity=".7"/>
  <!-- 황무지 -->
  <path d="M150 900 l20 -30 l15 25 l25 -40 l20 45" fill="none" stroke="#5b2a20" stroke-width="3"/>
  <path d="M380 960 l18 -26 l14 20 l22 -34 l18 40" fill="none" stroke="#5b2a20" stroke-width="3"/>
  <circle cx="290" cy="930" r="26" fill="none" stroke="#7a1f14" stroke-width="3" stroke-dasharray="3 4"/>
  <text x="290" y="940" text-anchor="middle" font-size="28" fill="#7a1f14">🔒</text>

  <!-- ===== 메인 퀘스트 루트 ===== -->
  <path d="M760 640 C640 560 480 520 330 500" fill="none" stroke="#b3261e" stroke-width="4" stroke-dasharray="12 8"/>
  <path d="M330 500 C520 360 850 330 1150 380" fill="none" stroke="#b3261e" stroke-width="4" stroke-dasharray="12 8"/>
  <path d="M1150 380 C1200 520 1180 650 1150 790" fill="none" stroke="#b3261e" stroke-width="4" stroke-dasharray="12 8"/>
  <path d="M1150 790 C1000 600 820 350 700 130" fill="none" stroke="#b3261e" stroke-width="4" stroke-dasharray="12 8"/>
  <path d="M700 130 C780 300 800 470 780 620" fill="none" stroke="#b3261e" stroke-width="4" stroke-dasharray="4 6"/>
  <!-- 단계 번호 -->
  <g>
    <circle cx="760" cy="640" r="17" fill="#b3261e" stroke="#fff" stroke-width="2.5"/><text x="760" y="647" text-anchor="middle" class="step">1</text>
    <circle cx="330" cy="500" r="17" fill="#b3261e" stroke="#fff" stroke-width="2.5"/><text x="330" y="507" text-anchor="middle" class="step">2</text>
    <circle cx="1150" cy="380" r="17" fill="#b3261e" stroke="#fff" stroke-width="2.5"/><text x="1150" y="387" text-anchor="middle" class="step">3</text>
    <circle cx="1150" cy="790" r="17" fill="#b3261e" stroke="#fff" stroke-width="2.5"/><text x="1150" y="797" text-anchor="middle" class="step">4</text>
    <circle cx="700" cy="130" r="17" fill="#b3261e" stroke="#fff" stroke-width="2.5"/><text x="700" y="137" text-anchor="middle" class="step">5</text>
  </g>

  <!-- ===== 이정표 (빠른 이동) ===== -->
  <use href="#wp" x="840" y="560"/><use href="#wp" x="390" y="600"/><use href="#wp" x="1020" y="300"/>
  <use href="#wp" x="990" y="700"/><use href="#wp" x="560" y="260"/>

  <!-- ===== 비경 (숨은 장소) ===== -->
  <use href="#star" x="250" y="470"/><text x="250" y="505" class="poi" text-anchor="middle">고목의 심장</text>
  <use href="#star" x="1240" y="410"/><text x="1260" y="445" class="poi" text-anchor="middle">멈춘 수레</text>
  <use href="#star" x="1090" y="880"/><text x="1030" y="905" class="poi" text-anchor="middle">물에 잠긴 여신상</text>
  <use href="#star" x="760" y="100"/><text x="778" y="92" class="poi">하늘 제단</text>
  <use href="#star" x="530" y="330"/><text x="548" y="323" class="poi">숨겨진 폭포</text>

  <!-- ===== 보물상자 ===== -->
  <use href="#chest" x="190" y="600"/><use href="#chest" x="1320" y="320"/><use href="#chest" x="1270" y="700"/>
  <use href="#chest" x="880" y="115"/><use href="#chest" x="500" y="360"/>

  <!-- ===== NPC ===== -->
  <use href="#npc" x="730" y="545"/><use href="#npc" x="395" y="505"/><use href="#npc" x="1090" y="410"/>
  <use href="#npc" x="1030" y="820"/><use href="#npc" x="620" y="115"/>

  <!-- ===== 지역 이름 ===== -->
  <text x="690" y="270" text-anchor="middle" class="rname">서리 봉우리</text>
  <text x="690" y="296" text-anchor="middle" class="rsub">난이도 ★★★★ · 은둔자 · 최종 제단</text>

  <text x="1165" y="515" text-anchor="middle" class="rname">버려진 광산</text>
  <text x="1165" y="541" text-anchor="middle" class="rsub">난이도 ★★ · 광부 브론</text>

  <text x="300" y="400" text-anchor="middle" class="rname">속삭이는 숲</text>
  <text x="300" y="426" text-anchor="middle" class="rsub">난이도 ★ · 사냥꾼 리아</text>

  <text x="760" y="755" text-anchor="middle" class="rname">새벽골 마을</text>
  <text x="760" y="781" text-anchor="middle" class="rsub">시작 지점 · 촌장 하렌</text>

  <text x="1140" y="670" text-anchor="middle" class="rname">가라앉은 유적</text>
  <text x="1140" y="696" text-anchor="middle" class="rsub">난이도 ★★★ · 학자 엘로윈</text>

  <text x="310" y="850" text-anchor="middle" class="rname">잿빛 황무지</text>
  <text x="310" y="876" text-anchor="middle" class="rsub">봉인됨 · 이후 업데이트</text>

  <!-- 나침반 -->
  <g transform="translate(1320 110)">
    <circle r="44" fill="#f4e7c5" stroke="#6b4f2a" stroke-width="2.5"/>
    <path d="M0 -38 L9 0 L0 38 L-9 0 Z" fill="#6b4f2a"/>
    <path d="M0 -38 L9 0 L-9 0 Z" fill="#b3261e"/>
    <path d="M-38 0 L0 -7 L38 0 L0 7 Z" fill="#8c7350"/>
    <text y="-50" text-anchor="middle" font-size="18" font-weight="bold" fill="#3b2a14">북</text>
  </g>
  <!-- 축척 -->
  <g transform="translate(60 60)">
    <rect x="0" y="0" width="100" height="8" fill="#3b2a14"/><rect x="100" y="0" width="100" height="8" fill="#f4e7c5" stroke="#3b2a14"/>
    <text x="0" y="30" class="poi">0</text><text x="200" y="30" class="poi" text-anchor="middle">약 300블록</text>
  </g>

  <!-- ===== 오른쪽 설명 패널 ===== -->
  <rect x="1420" y="0" width="440" height="1120" fill="#2a2118"/>
  <text x="1450" y="62" class="ptitle">새벽의 변경</text>
  <text x="1450" y="92" class="pm">RPG 서버 월드 컨셉 맵 · 초안 v0.1</text>
  <text x="1450" y="112" class="pm">전체 약 2,000 × 1,500 블록</text>

  <text x="1450" y="165" class="ph">기호</text>
  <g transform="translate(1466 196)"><path d="M-10 0 H14" stroke="#b3261e" stroke-width="4" stroke-dasharray="8 5"/></g>
  <text x="1500" y="202" class="pt">메인 퀘스트 루트 (①→⑤→마을)</text>
  <use href="#wp" x="1462" y="240"/><text x="1500" y="238" class="pt">이정표 — 밟으면 해금, 빠른 이동</text>
  <use href="#star" x="1462" y="272"/><text x="1500" y="278" class="pt">비경 — 숨은 장소, 발견 보상</text>
  <use href="#chest" x="1462" y="314"/><text x="1500" y="318" class="pt">보물상자 — 플레이어마다 1회</text>
  <use href="#npc" x="1462" y="352"/><text x="1500" y="358" class="pt">퀘스트 NPC</text>

  <text x="1450" y="420" class="ph">메인 퀘스트 흐름</text>
  <text x="1450" y="452" class="pt">① 새벽골 — 촌장이 "별의 조각" 이야기</text>
  <text x="1450" y="480" class="pt">② 숲 — 망자 사냥, 고목의 심장 찾기</text>
  <text x="1450" y="508" class="pt">③ 광산 — 철 원석 수집, 해골 소탕</text>
  <text x="1450" y="536" class="pt">④ 유적 — 여신상 발견, 유물 수집</text>
  <text x="1450" y="564" class="pt">⑤ 봉우리 — 하늘 제단에서 조각 복원</text>
  <text x="1450" y="592" class="pt">⑥ 마을로 귀환 — 엔딩, 칭호 획득</text>

  <text x="1450" y="652" class="ph">탐험 시스템</text>
  <text x="1450" y="684" class="pt">· 지역 첫 진입 시 제목 연출 + 보상</text>
  <text x="1450" y="712" class="pt">· 비경 근처에서 "무언가 느껴진다" 힌트</text>
  <text x="1450" y="740" class="pt">· 안 연 보물상자는 나에게만 반짝임</text>
  <text x="1450" y="768" class="pt">· 탐험도 % 에 따라 칭호</text>
  <text x="1450" y="796" class="pm">  풋내기 → 여행자 → 탐험가 → 개척자 → 전설</text>

  <text x="1450" y="856" class="ph">정해 주세요</text>
  <text x="1450" y="888" class="pt">· 세계관/테마 (중세 판타지? 동양풍?)</text>
  <text x="1450" y="916" class="pt">· 지역 수, 배치, 이름</text>
  <text x="1450" y="944" class="pt">· 맵 크기 (직접 건축 / 자연 지형)</text>
  <text x="1450" y="972" class="pt">· 전투 비중 (탐험 위주 / 사냥 위주)</text>
  <text x="1450" y="1000" class="pt">· 잿빛 황무지 같은 후반 콘텐츠</text>
  <text x="1450" y="1070" class="pm">이름·배치는 전부 예시입니다.</text>
</svg>
</body>
</html>
